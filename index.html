<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>かんたんスマホ教室</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f4f6f8;color:#222}
button{font:inherit;cursor:pointer} .app{max-width:720px;margin:auto;min-height:100vh;background:white}
header{padding:18px 18px 10px;border-bottom:1px solid #ddd;position:sticky;top:0;background:white;z-index:2}
h1{font-size:26px;margin:0 0 4px}h2{font-size:27px;margin:8px 0 16px}.sub{font-size:17px;color:#555}
main{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.bigbtn{border:2px solid #bbb;background:#fff;border-radius:16px;padding:20px 10px;min-height:105px;font-size:21px;font-weight:700}
.bigbtn:active,.choice:active{transform:scale(.98);background:#eee}.emoji{display:block;font-size:34px;margin-bottom:7px}
.back{width:100%;padding:15px;border:2px solid #888;border-radius:14px;background:white;font-weight:700;font-size:19px;margin-top:18px}
.card{border:2px solid #ddd;border-radius:18px;padding:18px;margin:12px 0;background:#fff}
.progress{height:18px;background:#ddd;border-radius:10px;overflow:hidden}.bar{height:100%;background:#333;width:0}
.choice{display:block;width:100%;padding:18px;margin:10px 0;border:2px solid #aaa;border-radius:14px;background:#fff;text-align:left;font-size:20px}
.ok{padding:18px;border-radius:15px;background:#eee;font-size:20px;font-weight:700;margin-top:14px}
.phone{max-width:330px;margin:15px auto;padding:18px;border:3px solid #222;border-radius:28px;background:#f5f5f5}
.screen{background:white;border-radius:18px;padding:22px;text-align:center}.num{font-size:30px;margin:15px 0}.call{font-size:25px;border:0;border-radius:50%;width:78px;height:78px}
.taparea{height:260px;border:3px dashed #888;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:24px;text-align:center;background:#fafafa}
.small{font-size:16px;color:#666}.settings{display:flex;gap:10px;align-items:center;justify-content:space-between}.settings button{padding:10px 14px;border-radius:10px;border:2px solid #888;background:#fff}
</style>

<style id="mobile-pwa-overrides">
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button, a, input, select, textarea {
    font: inherit;
    touch-action: manipulation;
  }
  button {
    min-height: 52px;
    min-width: 52px;
    cursor: pointer;
  }
  img, video, canvas { max-width: 100%; height: auto; }
  .mobile-app-shell {
    width: min(100%, 760px);
    margin: 0 auto;
    padding:
      max(12px, env(safe-area-inset-top))
      max(14px, env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(14px, env(safe-area-inset-left));
  }
  @media (max-width: 600px) {
    body { font-size: 18px; }
    h1 { font-size: clamp(1.7rem, 8vw, 2.5rem); }
    h2 { font-size: clamp(1.35rem, 6vw, 2rem); }
    button {
      width: 100%;
      min-height: 64px;
      margin: 6px 0;
      font-size: 1.1rem;
      border-radius: 14px;
    }
    input, select, textarea {
      width: 100%;
      min-height: 56px;
      font-size: 18px;
    }
  }
  @media (min-width: 601px) {
    .mobile-app-shell { padding-top: 24px; }
  }
</style>
</head>
<body><div class="mobile-app-shell">
<div class="app">
<header><h1>📱 かんたんスマホ教室</h1><div class="sub">ゆっくり練習してみましょう</div></header>
<main id="app"></main>
</div>
<script>
let state=JSON.parse(localStorage.getItem("seniorApp")||'{"done":0,"font":1}');
const lessons=[
["🔰","スマホの基本操作","タップ・長押し・スワイプを練習"],
["📞","電話の練習","電話をかける・切るを練習"],
["💬","メッセージの練習","文字を送る練習"],
["📷","カメラの練習","カメラを使う練習"],
["🔎","検索の練習","インターネットで調べる練習"],
["🛡️","詐欺クイズ","怪しいSMSや電話を見分ける"],
["🎮","タップ練習ゲーム","画面をタップする練習"]
];
function save(){localStorage.setItem("seniorApp",JSON.stringify(state))}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function done(){state.done++;save();renderHome()}
function home(){
app.innerHTML=`<div class="card"><div class="settings"><strong>進み具合</strong><span>${state.done} 回できました</span></div>
<div class="progress"><div class="bar" style="width:${Math.min(100,state.done*10)}%"></div></div></div>
<div class="grid">${lessons.map((x,i)=>`<button class="bigbtn" onclick="openLesson(${i})"><span class="emoji">${x[0]}</span>${x[1]}<div class="small">${x[2]}</div></button>`).join("")}</div>
<div class="card"><div class="settings"><strong>文字の大きさ</strong><div><button onclick="font(-.1)">小さく</button><button onclick="font(.1)">大きく</button></div></div></div>
<div class="card"><button class="bigbtn" style="width:100%;min-height:70px" onclick="speak('かんたんスマホ教室へようこそ。ゆっくり練習しましょう。')">🔊 説明を読み上げる</button></div>`;
document.body.style.fontSize=state.font+"em";
}
function renderHome(){home()}
function font(n){state.font=Math.max(.85,Math.min(1.35,state.font+n));save();home()}
function openLesson(i){[basic,phone,msg,camera,search,quiz,tap][i]()}
function shell(title,body){app.innerHTML=`<h2>${title}</h2>${body}<button class="back" onclick="renderHome()">← ホームに戻る</button>`}
function basic(){
shell("🔰 スマホの基本操作",`<div class="card"><b>① タップ</b><p>画面を指で「トン」と1回押します。</p><button class="choice" onclick="speak('タップできました。上手です。');this.textContent='✅ タップできました！'">ここをタップ</button></div>
<div class="card"><b>② 長押し</b><p>指を画面に少し長く置きます。</p><button class="choice" onpointerdown="this._t=setTimeout(()=>{this.textContent='✅ 長押しできました！';speak('長押しできました。')},700)" onpointerup="clearTimeout(this._t)">ここを長押し</button></div>
<div class="card"><b>③ スワイプ</b><p>指を画面に置いて、横へ動かします。</p><div class="taparea" id="swipe">ここを右へスワイプ →</div></div>`);
let el=document.getElementById("swipe"),x=0;el.addEventListener("touchstart",e=>x=e.touches[0].clientX);el.addEventListener("touchend",e=>{if(e.changedTouches[0].clientX-x>60){el.textContent="✅ スワイプできました！";speak("スワイプできました。")}});
}
function phone(){shell("📞 電話の練習",`<p>「電話をかける」ボタンを押してみましょう。</p><div class="phone"><div class="screen"><div>練習用の電話</div><div class="num">090-1234-5678</div><button class="call" onclick="this.textContent='☎️';this.style.background='#ddd';speak('電話をかけました。これは練習です。')">📞</button><p>練習用なので実際には電話しません。</p></div></div><button class="choice" onclick="done()">✅ できた！</button>`)}
function msg(){shell("💬 メッセージの練習",`<div class="card"><p>誰かに送る文章を選んでみましょう。</p>${["こんにちは！","今から帰ります。","ありがとう！"].map(t=>`<button class="choice" onclick="this.textContent='✅ '+this.textContent;speak('メッセージを選びました')">${t}</button>`).join("")}</div><button class="choice" onclick="done()">✅ できた！</button>`)}
function camera(){shell("📷 カメラの練習",`<div class="card"><p>カメラのボタンを押してみましょう。</p><button class="bigbtn" style="width:100%" onclick="this.innerHTML='📸<br>写真を撮りました！';speak('写真を撮りました。これは練習です。')">📷 写真を撮る</button><p class="small">この練習では実際のカメラは起動しません。</p></div><button class="choice" onclick="done()">✅ できた！</button>`)}
function search(){shell("🔎 検索の練習",`<div class="card"><p>調べたいものを入力してみましょう。</p><input id="q" style="width:100%;padding:16px;font-size:20px;border:2px solid #999;border-radius:12px" placeholder="例：今日の天気"><button class="choice" onclick="let q=document.getElementById('q').value.trim();if(q){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}else{speak('検索する言葉を入力してください')}">🔎 検索する</button><p class="small">検索結果は別の画面で開きます。</p></div><button class="choice" onclick="done()">✅ できた！</button>`)}
function quiz(){let qs=[["「荷物を届けられません。住所を確認してください」というSMSが来た。どうする？",["リンクをすぐ押す","公式アプリや公式サイトから確認する","返信する"],1],["知らない番号から「今日中にお金を払って」と電話が来た。",["すぐ払う","家族や相談窓口に確認する","相手に個人情報を伝える"],1],["「当選しました！」というメールが来た。",["リンクを押して個人情報を入力","無視して削除する","返信して名前を送る"],1]];let n=0;function next(){if(n>=qs.length){shell("🎉 クイズ終了",`<div class="ok">すべて終わりました！よくできました。</div><button class="choice" onclick="done()">🏆 できた！</button>`);return}let q=qs[n];shell("🛡️ 詐欺クイズ",`<div class="card"><b>問題 ${n+1}</b><p style="font-size:22px">${q[0]}</p>${q[1].map((a,j)=>`<button class="choice" onclick="if(${j}===${q[2]}){this.textContent='✅ 正解！';speak('正解です。');}else{this.textContent='❌ もう一度考えてみましょう';speak('もう一度考えてみましょう');}">${a}</button>`).join("")}</div><button class="choice" onclick="n++;next()">次の問題 →</button>`)}next()}
function tap(){let count=0;let target=document.createElement("div");shell("🎮 タップ練習",`<p>中央のボタンを10回タップしましょう。</p><button class="bigbtn" style="width:100%;height:180px" id="tapb" onclick="count++;this.innerHTML='👆<br>'+count+' 回';if(count>=10){this.innerHTML='🎉 できました！';speak('10回タップできました。');}}">👆<br>ここをタップ</button>`)}
home();
</script>
</div>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
